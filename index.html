<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-Queen Visualiser</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-content">
        <i class="fas fa-chess-board header-icon"></i>
        <h1>N-<span>Queens</span> Visualiser</h1>
        <i class="fas fa-crown header-icon"></i>
      </div>
      <p class="header-sub">Watch the backtracking algorithm solve the N-Queens problem in real time</p>
    </header>

    <div class="control-panel">
      <div class="control-card">
        <div class="inputbox">
          <i class="fas fa-chess-queen input-icon"></i>
          <input type="number" class="numberbox" id="numberbox" min="1" max="8" required />
          <label>Number of Queens (1–8)</label>
        </div>

        <div class="speed-section">
          <span class="speed-label"><i class="fas fa-tachometer-alt"></i> Speed</span>
          <div class="slider-container">
            <span class="speed-tag">SLOW</span>
            <input class="slider" id="slider" type="range" min="0" max="100" value="60" />
            <div id="progress-bar"></div>
            <span class="speed-tag">FAST</span>
          </div>
        </div>

        <button class="play-button" id="play-button">
          <i class="fa fa-play"></i> Visualise
        </button>
      </div>
    </div>

    <div class="queen-arrangement" id="queen-arrangement"></div>
    <div id="n-queen-board"></div>
    <script src="app.js"></script>
  </body>
</html>
